instructions:
  - group: Increment/Decrement
    instruction: INC zp
    documentation: Increments the byte at zero page address zp.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xE6
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data + 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: "INC zp,X"
    documentation: Increments the byte at zero page address zp + X. The zero page address wraps within page zero.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xF6
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data + 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: INC abs
    documentation: Increments the byte at address abs.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xEE
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data + 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: "INC abs,X"
    documentation: Increments the byte at address abs + X.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xFE
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); request(action.memory_read);
      - Address = AD + X; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data + 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: INX
    documentation: Increments X.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xE8
    steps:
      - X = X + 1; flags();
    flags:
      Z: is_zero(X)
      N: is_negative(X)

  - group: Increment/Decrement
    instruction: DEX
    documentation: Decrements X.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xCA
    steps:
      - X = X - 1; flags();
    flags:
      Z: is_zero(X)
      N: is_negative(X)

  - group: Increment/Decrement
    instruction: INY
    documentation: Increments Y.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xC8
    steps:
      - Y = Y + 1; flags();
    flags:
      Z: is_zero(Y)
      N: is_negative(Y)

  - group: Increment/Decrement
    instruction: DEC zp
    documentation: Decrements the byte at zero page address zp.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xC6
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data - 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: "DEC zp,X"
    documentation: Decrements the byte at zero page address zp + X. The zero page address wraps within page zero.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xD6
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data - 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: DEC abs
    documentation: Decrements the byte at address abs.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xCE
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data - 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: "DEC abs,X"
    documentation: Decrements the byte at address abs + X.
    next_opcode: overlapped
    opcodes:
      - opcode: 0xDE
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); request(action.memory_read);
      - Address = AD + X; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - Data = (Data - 1) & 0xFF; P = P & 0x7D; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; request(action.memory_write);
      -

  - group: Increment/Decrement
    instruction: DEY
    documentation: Decrements Y.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x88
    steps:
      - Y = Y - 1; flags();
    flags:
      Z: is_zero(Y)
      N: is_negative(Y)
      
