instructions:
  - group: Status
    instruction: CLC
    documentation: Resets the carry flag.
    opcodes:
      - opcode: 0x18
    steps:
      - P = P & 0xFE;

  - group: Status
    instruction: SEC
    documentation: Sets the carry flag.
    opcodes:
      - opcode: 0x38
    steps:
      - P = P | 0x01;

  - group: Status
    instruction: CLI
    documentation: "Resets the interrupt disable flag, enabling IRQ interrupts."
    opcodes:
      - opcode: 0x58
    steps:
      - P = P & 0xFB;

  - group: Status
    instruction: SEI
    documentation: "Sets the interrupt disable flag, disabling IRQ interrupts."
    opcodes:
      - opcode: 0x78
    steps:
      - P = P | 0x04;

  - group: Status
    instruction: CLV
    documentation: Resets the overflow flag.
    opcodes:
      - opcode: 0xB8
    steps:
      - P = P & 0xBF;

  - group: Status
    instruction: CLD
    documentation: "Resets the decimal flag, so that ADC and SBC work in binary."
    opcodes:
      - opcode: 0xD8
    steps:
      - P = P & 0xF7;

  - group: Status
    instruction: SED
    documentation: "Sets the decimal flag, so that ADC and SBC work in binary coded decimal."
    opcodes:
      - opcode: 0xF8
    steps:
      - P = P | 0x08;
