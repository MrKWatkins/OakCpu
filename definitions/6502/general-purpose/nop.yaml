  - group: General Purpose
    instruction: NOP abs
    documentation: Does nothing; the byte at address abs is read and ignored.
    undocumented: true
    next_opcode: custom
    opcodes:
      - opcode: 0x0C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; move_to_sequence(sequence.nop_finish); request(action.memory_read);

  - group: General Purpose
    instruction: "NOP abs,X"
    documentation: Does nothing; the byte at address abs + X is read and ignored. Takes an extra cycle if adding X crosses a page.
    undocumented: true
    next_opcode: custom
    opcodes:
      - opcode: 0x1C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); if !did_indexed_address_page_cross(AD, X); move_to_sequence(sequence.nop_read_finish); endif; request(action.memory_read);
      - Address = AD + X; move_to_sequence(sequence.nop_read_finish); request(action.memory_read);

