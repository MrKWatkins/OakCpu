sequences:
  - name: lax_finish
    next_opcode: custom
    steps:
      - A = Data; X = Data; P = P & 0x5D; if is_zero(A); P = P | 0x02; endif; if is_negative(A); P = P | 0x80; endif; instruction_complete(true);

instructions:
  - group: Undocumented
    instruction: "LAX #n"
    documentation: "Loads both A and X with n AND (A OR 0xEE). The 0xEE varies between chips, so the result is unreliable."
    undocumented: true
    opcodes:
      - opcode: 0xAB
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - $value = Data & (A | 0xEE); A = $value; X = $value; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Undocumented
    instruction: LAX zp
    documentation: Loads both A and X with the byte at zero page address zp.
    undocumented: true
    opcodes:
      - opcode: 0xA7
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - A = Data; X = Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Undocumented
    instruction: "LAX zp,Y"
    documentation: Loads both A and X with the byte at zero page address zp + Y. The zero page address wraps within page zero.
    undocumented: true
    opcodes:
      - opcode: 0xB7
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + Y) & 0x00FF; request(action.memory_read);
      - A = Data; X = Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Undocumented
    instruction: LAX abs
    documentation: Loads both A and X with the byte at address abs.
    undocumented: true
    opcodes:
      - opcode: 0xAF
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - A = Data; X = Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Undocumented
    instruction: "LAX abs,Y"
    documentation: Loads both A and X with the byte at address abs + Y. Takes an extra cycle if adding Y crosses a page.
    undocumented: true
    next_opcode: custom
    opcodes:
      - opcode: 0xBF
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.lax_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.lax_finish); request(action.memory_read);

  - group: Undocumented
    instruction: "LAX (zp,X)"
    documentation: Loads both A and X with the byte at the address stored at zero page address zp + X. The zero page address wraps within page zero.
    undocumented: true
    opcodes:
      - opcode: 0xA3
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - AD = (AD + X) & 0x00FF; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - A = Data; X = Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Undocumented
    instruction: "LAX (zp),Y"
    documentation: Loads both A and X with the byte at Y plus the address stored at zero page address zp. Takes an extra cycle if adding Y crosses a page.
    undocumented: true
    next_opcode: custom
    opcodes:
      - opcode: 0xB3
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - AD = AD | (Data << 8); Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.lax_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.lax_finish); request(action.memory_read);

  - group: Undocumented
    instruction: SAX zp
    documentation: Stores A AND X at zero page address zp.
    undocumented: true
    next_opcode: overlapped
    opcodes:
      - opcode: 0x87
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; Data = A & X; request(action.memory_write);
      -

  - group: Undocumented
    instruction: "SAX zp,Y"
    documentation: Stores A AND X at zero page address zp + Y. The zero page address wraps within page zero.
    undocumented: true
    next_opcode: overlapped
    opcodes:
      - opcode: 0x97
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + Y) & 0x00FF; Data = A & X; request(action.memory_write);
      -

  - group: Undocumented
    instruction: SAX abs
    documentation: Stores A AND X at address abs.
    undocumented: true
    next_opcode: overlapped
    opcodes:
      - opcode: 0x8F
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; Data = A & X; request(action.memory_write);
      -

  - group: Undocumented
    instruction: "SAX (zp,X)"
    documentation: Stores A AND X at the address stored at zero page address zp + X. The zero page address wraps within page zero.
    undocumented: true
    next_opcode: overlapped
    opcodes:
      - opcode: 0x83
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - AD = (AD + X) & 0x00FF; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; Data = A & X; request(action.memory_write);
