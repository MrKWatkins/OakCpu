instructions:
  - group: Shift
    instruction: ROR A
    documentation: "Rotates A right one bit through the carry flag, moving bit 0 into the carry flag and the previous carry flag into bit 7."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x6A
    steps:
      - $carry = P & 0x01; $value = A; A = (($value >> 1) | ($carry << 7)) & 0xFF; P = P & 0x7C; if is_zero(A); P = P | 0x02; endif; if is_negative(A); P = P | 0x80; endif; if ($value & 0x01) != 0; P = P | 0x01; endif;

  - group: Shift
    instruction: ROR zp
    documentation: "Rotates the byte at zero page address zp right one bit through the carry flag, moving bit 0 into the carry flag and the previous carry flag into bit 7."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x66
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $carry = P & 0x01; $value = Data; Data = (($value >> 1) | ($carry << 7)) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if ($value & 0x01) != 0; P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: "ROR zp,X"
    documentation: "Rotates the byte at zero page address zp + X right one bit through the carry flag, moving bit 0 into the carry flag and the previous carry flag into bit 7. The zero page address wraps within page zero."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x76
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $carry = P & 0x01; $value = Data; Data = (($value >> 1) | ($carry << 7)) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if ($value & 0x01) != 0; P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: ROR abs
    documentation: "Rotates the byte at address abs right one bit through the carry flag, moving bit 0 into the carry flag and the previous carry flag into bit 7."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x6E
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $carry = P & 0x01; $value = Data; Data = (($value >> 1) | ($carry << 7)) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if ($value & 0x01) != 0; P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: "ROR abs,X"
    documentation: "Rotates the byte at address abs + X right one bit through the carry flag, moving bit 0 into the carry flag and the previous carry flag into bit 7."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x7E
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); request(action.memory_read);
      - Address = AD + X; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $carry = P & 0x01; $value = Data; Data = (($value >> 1) | ($carry << 7)) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if ($value & 0x01) != 0; P = P | 0x01; endif; request(action.memory_write);
      -
