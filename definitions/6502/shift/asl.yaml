instructions:
  - group: Shift
    instruction: ASL A
    documentation: "Shifts A left one bit, moving bit 7 into the carry flag and resetting bit 0."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x0A
    steps:
      - $value = A; A = ($value << 1) & 0xFF; P = P & 0x7C; if is_zero(A); P = P | 0x02; endif; if is_negative(A); P = P | 0x80; endif; if is_negative($value); P = P | 0x01; endif;

  - group: Shift
    instruction: ASL zp
    documentation: "Shifts the byte at zero page address zp left one bit, moving bit 7 into the carry flag and resetting bit 0."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x06
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $value = Data; Data = ($value << 1) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if is_negative($value); P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: "ASL zp,X"
    documentation: "Shifts the byte at zero page address zp + X left one bit, moving bit 7 into the carry flag and resetting bit 0. The zero page address wraps within page zero."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x16
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $value = Data; Data = ($value << 1) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if is_negative($value); P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: ASL abs
    documentation: "Shifts the byte at address abs left one bit, moving bit 7 into the carry flag and resetting bit 0."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x0E
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $value = Data; Data = ($value << 1) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if is_negative($value); P = P | 0x01; endif; request(action.memory_write);
      -

  - group: Shift
    instruction: "ASL abs,X"
    documentation: "Shifts the byte at address abs + X left one bit, moving bit 7 into the carry flag and resetting bit 0."
    next_opcode: overlapped
    opcodes:
      - opcode: 0x1E
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); request(action.memory_read);
      - Address = AD + X; request(action.memory_read);
      - Data = Data; request(action.memory_write);
      - $value = Data; Data = ($value << 1) & 0xFF; P = P & 0x7C; if is_zero(Data); P = P | 0x02; endif; if is_negative(Data); P = P | 0x80; endif; if is_negative($value); P = P | 0x01; endif; request(action.memory_write);
      -
