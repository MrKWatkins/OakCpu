instructions:
  - group: Logical
    instruction: BIT zp
    documentation: "Tests A against the byte at zero page address zp: the Z flag is set from A AND the byte, and the N and V flags are copied from bits 7 and 6 of the byte."
    opcodes:
      - opcode: 0x24
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - $result = A & Data; flags();
    flags:
      Z: is_zero($result)
      V: (Data & 0x40) != 0
      N: is_negative(Data)

  - group: Logical
    instruction: BIT abs
    documentation: "Tests A against the byte at address abs: the Z flag is set from A AND the byte, and the N and V flags are copied from bits 7 and 6 of the byte."
    opcodes:
      - opcode: 0x2C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - $result = A & Data; flags();
    flags:
      Z: is_zero($result)
      V: (Data & 0x40) != 0
      N: is_negative(Data)
