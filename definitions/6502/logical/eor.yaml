sequences:
  - name: eor_finish
    next_opcode: custom
    steps:
      - A = A ^ Data; P = P & 0x5D; if is_zero(A); P = P | 0x02; endif; if is_negative(A); P = P | 0x80; endif; instruction_complete(true);

instructions:
  - group: Logical
    instruction: "EOR #n"
    documentation: Bitwise exclusive ORs A with n.
    opcodes:
      - opcode: 0x49
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - A = A ^ Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Logical
    instruction: EOR zp
    documentation: Bitwise exclusive ORs A with the byte at zero page address zp.
    opcodes:
      - opcode: 0x45
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - A = A ^ Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Logical
    instruction: "EOR zp,X"
    documentation: Bitwise exclusive ORs A with the byte at zero page address zp + X. The zero page address wraps within page zero.
    opcodes:
      - opcode: 0x55
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - A = A ^ Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Logical
    instruction: EOR abs
    documentation: Bitwise exclusive ORs A with the byte at address abs.
    opcodes:
      - opcode: 0x4D
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - A = A ^ Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Logical
    instruction: "EOR abs,X"
    documentation: Bitwise exclusive ORs A with the byte at address abs + X. Takes an extra cycle if adding X crosses a page.
    next_opcode: custom
    opcodes:
      - opcode: 0x5D
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); if !did_indexed_address_page_cross(AD, X); move_to_sequence(sequence.eor_finish); endif; request(action.memory_read);
      - Address = AD + X; move_to_sequence(sequence.eor_finish); request(action.memory_read);

  - group: Logical
    instruction: "EOR abs,Y"
    documentation: Bitwise exclusive ORs A with the byte at address abs + Y. Takes an extra cycle if adding Y crosses a page.
    next_opcode: custom
    opcodes:
      - opcode: 0x59
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.eor_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.eor_finish); request(action.memory_read);

  - group: Logical
    instruction: "EOR (zp,X)"
    documentation: Bitwise exclusive ORs A with the byte at the address stored at zero page address zp + X. The zero page address wraps within page zero.
    opcodes:
      - opcode: 0x41
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - AD = (AD + X) & 0x00FF; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - A = A ^ Data; flags();
    flags:
      Z: is_zero(A)
      N: is_negative(A)

  - group: Logical
    instruction: "EOR (zp),Y"
    documentation: Bitwise exclusive ORs A with the byte at Y plus the address stored at zero page address zp. Takes an extra cycle if adding Y crosses a page.
    next_opcode: custom
    opcodes:
      - opcode: 0x51
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - AD = AD | (Data << 8); Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.eor_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.eor_finish); request(action.memory_read);
