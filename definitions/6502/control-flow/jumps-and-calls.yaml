instructions:
  - group: Jump
    instruction: JMP abs
    documentation: Jumps to address abs.
    opcodes:
      - opcode: 0x4C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - PC = (Data << 8) | AD;

  - group: Jump
    instruction: JMP (abs)
    documentation: "Jumps to the address stored at address abs. If abs is the last byte of a page, the high byte of the address is read from the first byte of the same page rather than the next one."
    opcodes:
      - opcode: 0x6C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = AD | (Data << 8); Address = AD; request(action.memory_read);
      - Address = (AD & 0xFF00) | ((AD + 1) & 0x00FF); AD = Data; request(action.memory_read);
      - PC = (Data << 8) | AD;

  - group: Call and Return
    instruction: JSR abs
    documentation: Pushes the address of the last byte of the instruction onto the stack and jumps to address abs.
    opcodes:
      - opcode: 0x20
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = 0x0100 | S; request(action.memory_read);
      - Address = 0x0100 | S; Data = PC >> 8; S = S - 1; request(action.memory_write);
      - Address = 0x0100 | S; Data = PC & 0xFF; S = S - 1; request(action.memory_write);
      - Address = PC; request(action.memory_read);
      - PC = (Data << 8) | AD;

  - group: Call and Return
    instruction: RTS
    documentation: Pops the return address pushed by JSR from the stack and jumps to the byte after it.
    opcodes:
      - opcode: 0x60
    steps:
      - Address = PC; request(action.memory_read);
      - Address = 0x0100 | S; request(action.memory_read);
      - S = S + 1; Address = 0x0100 | S; request(action.memory_read);
      - S = S + 1; AD = Data; Address = 0x0100 | S; request(action.memory_read);
      - Address = (Data << 8) | AD; AD = Address; request(action.memory_read);
      - PC = AD + 1;
