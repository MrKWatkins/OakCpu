instructions:
  - group: Store
    instruction: STY zp
    documentation: Stores Y at zero page address zp.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x84
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; Data = Y; request(action.memory_write);
      -

  - group: Store
    instruction: "STY zp,X"
    documentation: Stores Y at zero page address zp + X. The zero page address wraps within page zero.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x94
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; Data = Y; request(action.memory_write);
      -

  - group: Store
    instruction: STY abs
    documentation: Stores Y at address abs.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x8C
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; Data = Y; request(action.memory_write);
      -
