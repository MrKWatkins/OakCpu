instructions:
  - group: Store
    instruction: STX zp
    documentation: Stores X at zero page address zp.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x86
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; Data = X; request(action.memory_write);
      -

  - group: Store
    instruction: "STX zp,Y"
    documentation: Stores X at zero page address zp + Y. The zero page address wraps within page zero.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x96
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + Y) & 0x00FF; Data = X; request(action.memory_write);
      -

  - group: Store
    instruction: STX abs
    documentation: Stores X at address abs.
    next_opcode: overlapped
    opcodes:
      - opcode: 0x8E
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; Data = X; request(action.memory_write);
      -
