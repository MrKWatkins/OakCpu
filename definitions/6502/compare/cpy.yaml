instructions:
  - group: Compare
    instruction: "CPY #n"
    documentation: "Compares Y with n by subtracting the byte from Y, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xC0
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - $result = Y - Data; flags();
    flags:
      C: Y >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CPY zp
    documentation: "Compares Y with the byte at zero page address zp by subtracting the byte from Y, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xC4
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - $result = Y - Data; flags();
    flags:
      C: Y >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CPY abs
    documentation: "Compares Y with the byte at address abs by subtracting the byte from Y, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xCC
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - $result = Y - Data; flags();
    flags:
      C: Y >= Data
      Z: is_zero($result)
      N: is_negative($result)
