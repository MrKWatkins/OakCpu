instructions:
  - group: Compare
    instruction: "CPX #n"
    documentation: "Compares X with n by subtracting the byte from X, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xE0
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - $result = X - Data; flags();
    flags:
      C: X >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CPX zp
    documentation: "Compares X with the byte at zero page address zp by subtracting the byte from X, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xE4
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - $result = X - Data; flags();
    flags:
      C: X >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CPX abs
    documentation: "Compares X with the byte at address abs by subtracting the byte from X, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xEC
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - $result = X - Data; flags();
    flags:
      C: X >= Data
      Z: is_zero($result)
      N: is_negative($result)
