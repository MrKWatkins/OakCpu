sequences:
  - name: cmp_finish
    next_opcode: custom
    steps:
      - P = P & 0x5C; if A >= Data; P = P | 0x01; endif; $result = A - Data; if is_zero($result); P = P | 0x02; endif; if is_negative($result); P = P | 0x80; endif; instruction_complete(true);

instructions:
  - group: Compare
    instruction: "CMP #n"
    documentation: "Compares A with n by subtracting the byte from A, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xC9
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - $result = A - Data; flags();
    flags:
      C: A >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CMP zp
    documentation: "Compares A with the byte at zero page address zp by subtracting the byte from A, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xC5
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = Data; request(action.memory_read);
      - $result = A - Data; flags();
    flags:
      C: A >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: "CMP zp,X"
    documentation: "Compares A with the byte at zero page address zp + X by subtracting the byte from A, setting the flags from the result and discarding it. The zero page address wraps within page zero."
    opcodes:
      - opcode: 0xD5
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + X) & 0x00FF; request(action.memory_read);
      - $result = A - Data; flags();
    flags:
      C: A >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: CMP abs
    documentation: "Compares A with the byte at address abs by subtracting the byte from A, setting the flags from the result and discarding it."
    opcodes:
      - opcode: 0xCD
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - $result = A - Data; flags();
    flags:
      C: A >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: "CMP abs,X"
    documentation: "Compares A with the byte at address abs + X by subtracting the byte from A, setting the flags from the result and discarding it. Takes an extra cycle if adding X crosses a page."
    next_opcode: custom
    opcodes:
      - opcode: 0xDD
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + X) & 0x00FF); if !did_indexed_address_page_cross(AD, X); move_to_sequence(sequence.cmp_finish); endif; request(action.memory_read);
      - Address = AD + X; move_to_sequence(sequence.cmp_finish); request(action.memory_read);

  - group: Compare
    instruction: "CMP abs,Y"
    documentation: "Compares A with the byte at address abs + Y by subtracting the byte from A, setting the flags from the result and discarding it. Takes an extra cycle if adding Y crosses a page."
    next_opcode: custom
    opcodes:
      - opcode: 0xD9
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - Address = PC; PC = PC + 1; AD = Data; request(action.memory_read);
      - AD = (Data << 8) | AD; Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.cmp_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.cmp_finish); request(action.memory_read);

  - group: Compare
    instruction: "CMP (zp,X)"
    documentation: "Compares A with the byte at the address stored at zero page address zp + X by subtracting the byte from A, setting the flags from the result and discarding it. The zero page address wraps within page zero."
    opcodes:
      - opcode: 0xC1
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - AD = (AD + X) & 0x00FF; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - Address = (Data << 8) | AD; request(action.memory_read);
      - $result = A - Data; flags();
    flags:
      C: A >= Data
      Z: is_zero($result)
      N: is_negative($result)

  - group: Compare
    instruction: "CMP (zp),Y"
    documentation: "Compares A with the byte at Y plus the address stored at zero page address zp by subtracting the byte from A, setting the flags from the result and discarding it. Takes an extra cycle if adding Y crosses a page."
    next_opcode: custom
    opcodes:
      - opcode: 0xD1
    steps:
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - AD = Data; Address = AD; request(action.memory_read);
      - Address = (AD + 1) & 0x00FF; AD = Data; request(action.memory_read);
      - AD = AD | (Data << 8); Address = (AD & 0xFF00) | ((AD + Y) & 0x00FF); if !did_indexed_address_page_cross(AD, Y); move_to_sequence(sequence.cmp_finish); endif; request(action.memory_read);
      - Address = AD + Y; move_to_sequence(sequence.cmp_finish); request(action.memory_read);
