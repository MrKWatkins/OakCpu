# Decoded from ZX Spectrum Next FPGA core version 3.02.03:
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n_mcode.vhd#L1953
#     Four machine cycles of the same shape as LDIRX's, so twenty one T-states while repeating and sixteen for the last iteration.
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n.vhd#L1119
#     The address read from is HL(15 downto 3) & E(2 downto 0), i.e. the byte at the same position within the aligned eight byte
#     block that E addresses, which is what makes this useful for tiled patterns. HL is left alone; only DE and BC move on.
#
# The write is conditional in the same way as it is for LDIX; see ldix.yaml for that and for the disagreement with the wiki over
# whether the Z80N block transfers write flags.
instructions:
  - group: Z80N Block Transfer
    mnemonic: LDPIRX
    documentation: "Copies the byte at ((HL & 0xFFF8) + (E & 7)), i.e. from the eight byte aligned pattern at HL, to (DE) unless it equals A, then increments DE and decrements BC, repeating until BC is zero."
    opcodes:
      - opcode: 0xED 0xB7
    steps:
      - Address = (HL & 0xFFF8) | (E & 0x07); request(action.memory_read);
      -
      -
      - |
        latch = Data;
        Address = DE; DE = DE + 1;
        if A != latch;
          request(action.memory_write);
        else;
          request(action.memory_read);
        endif;
      -
      -
      -
      - |
        $result = A + latch;
        BC = BC - 1;
        if BC == 0;
          $x = $result & 0x08;
          $y = $result & 0x02;
          flags();
          instruction_complete();
        endif;
      -
      - PC = PC - 1; WZ = PC; PC = PC - 1; $x = PCH & 0x08; $y = PCH & 0x20; flags();
      -
      -
      -
      -
    override_step_pins:
      - []
      - [MREQ, RD]
      - [MREQ, RD]
      - []
      - [MREQ]
      - [MREQ, WR]
    flags:
      N: 0
      PV: BC != 0;
      X: $x != 0
      H: 0
      Y: $y != 0
