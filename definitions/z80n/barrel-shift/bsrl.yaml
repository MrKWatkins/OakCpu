# Decoded from ZX Spectrum Next FPGA core version 3.02.03:
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n_mcode.vhd#L1801
#     A single four T-state machine cycle that dispatches the BSRL_DE_B command, so eight T-states in total with the prefix fetch.
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n.vhd#L1001
#     Shared with BSRA and BSRF; bit 0 of the opcode is put into bit 16 of the seventeen bit temporary before the shift, which is
#     zero for 0xED 0x2A, so the shift fills with zeroes. Shifts of sixteen or more leave DE zero. No flags are written.
instructions:
  - group: Z80N Barrel Shift
    mnemonic: BSRL DE, B
    documentation: "Shifts DE right by the number of bits in the low five bits of B, filling with zeroes."
    opcodes:
      - opcode: 0xED 0x2A
    steps:
      - DE = DE >> (B & 0x1F);
