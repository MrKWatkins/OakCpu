# Decoded from ZX Spectrum Next FPGA core version 3.02.03:
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n_mcode.vhd#L1712
#     A single four T-state machine cycle that dispatches the MUL_DE command, so eight T-states in total with the prefix fetch.
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n.vhd#L729
#     DE <= D * E, unsigned, with the product's high byte in D and low byte in E. No flags are written.
instructions:
  - group: Z80N Arithmetic
    mnemonic: MUL D, E
    documentation: "Multiplies D by E, storing the 16-bit result in DE."
    opcodes:
      - opcode: 0xED 0x30
    steps:
      - DE = D * E;
