# The Z80N is the Z80 variant in the ZX Spectrum Next. It adds instructions in the unused ED prefixed opcodes; everything else is inherited from the Z80.
#
# There is no Z80N silicon; the CPU is the T80N core in the ZX Spectrum Next FPGA, so that core is the definitive reference for both
# behaviour and timing. Definitions are decoded from core version 3.02.03:
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n_mcode.vhd
#     Microcode; machine cycle counts, their T-states, and the bus activity in each.
#   https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA/-/blob/master/cores/zxnext/src/cpu/t80n.vhd
#     The core itself; the behaviour of the instructions the microcode dispatches to it as Z80N commands.
# Every instruction file links the lines it was decoded from. The T-state totals in
# https://wiki.specnext.dev/Extended_Z80_instruction_set were used as a cross-check only; it warns that its timings are based on limited testing, so the core
# wins where they disagree.
#
# Reading the microcode:
#   * Machine cycle one is the fetch of the ED prefixed opcode. The fetch of the ED prefix itself is a separate, earlier machine
#     cycle, so every instruction costs eight T-states before its microcode's remaining machine cycles.
#   * Machine cycles default to three T-states; TStates <= "100" or "101" makes one four or five instead.
#   * Machine cycles asserting IORQ get an automatic wait T-state, e.g. IN r, (C) has a three T-state cycle that takes four.
#   * Set_Addr_To sets the address for the *next* machine cycle, not the one it appears in.
#   * Instructions that only dispatch a Z80N command, with no further machine cycles, take eight T-states in total.
cpu:
  name: Z80N
  base: z80
  documentation: Provides generated Z80N CPU emulators. The Z80N is the Z80 variant used in the ZX Spectrum Next.

  # Appended to the pins inherited from the Z80, so the values generated for the Z80's pins do not change.
  pins:
    - name: NEXTREG
      documentation: Next register write; the low byte of the address bus holds the number of the Next register to write to and the data bus holds the value to write to it.

  # Appended to the actions inherited from the Z80, so the values generated for the Z80's actions do not change.
  actions:
    - name: next_register_write
      documentation: The host must write Data to the Next register numbered by the low byte of Address.
      # The Next registers are on a bus of their own inside the FPGA rather than on the I/O bus, so no I/O pins are asserted. The
      # machine cycle that strobes the write is three T-states long.
      pins: [[NEXTREG], [NEXTREG], [NEXTREG]]
