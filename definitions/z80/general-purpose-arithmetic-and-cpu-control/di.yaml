instructions:
  - group: General-Purpose Arithmetic and CPU Control
    instruction: DI
    documentation: "Disables maskable interrupts by resetting IFF1 and IFF2."
    opcodes:
      - opcode: 0xF3
      - opcode: 0xDD 0xF3
      - opcode: 0xFD 0xF3
    steps:
      - IFF1 = false; IFF2 = false;
    
