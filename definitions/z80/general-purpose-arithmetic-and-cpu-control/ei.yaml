instructions:
  - group: General-Purpose Arithmetic and CPU Control
    mnemonic: EI
    documentation: "Enables maskable interrupts by setting IFF1 and IFF2. An interrupt is not accepted until after the following instruction."
    opcodes:
      - opcode: 0xFB
      - opcode: 0xDD 0xFB
      - opcode: 0xFD 0xFB
    steps:
      # Use custom so the standard on_instruction_complete (which handles interrupts) *isn't* executed. This is to prevent interrupts firing inside EI.
      # We then have to manually include the reset of Q and overlapped memory read. 
      - IFF1 = true; IFF2 = true; Q = 0; Address = PC; PC = PC + 1; current_step = 1; request(action.opcode_read);
    next_opcode: custom
