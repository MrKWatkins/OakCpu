instructions:
  - group: General-Purpose Arithmetic and CPU Control
    instruction: IM 0
    documentation: "Selects interrupt mode 0, in which the interrupting device supplies an instruction on the data bus for the CPU to execute."
    opcodes:
      - opcode: 0xED 0x46
      - opcode: 0xED 0x4E
      - opcode: 0xED 0x66
      - opcode: 0xED 0x6E
    steps:
      - IM = 0;
    
  - group: General-Purpose Arithmetic and CPU Control
    instruction: IM 1
    documentation: "Selects interrupt mode 1, in which a maskable interrupt calls address 0x0038."
    opcodes:
      - opcode: 0xED 0x56
      - opcode: 0xED 0x76
    steps:
      - IM = 1;
    
  - group: General-Purpose Arithmetic and CPU Control
    instruction: IM 2
    documentation: "Selects interrupt mode 2, in which a maskable interrupt calls the address read from the vector table whose high byte is I and whose low byte is supplied by the interrupting device."
    opcodes:
      - opcode: 0xED 0x5E
      - opcode: 0xED 0x7E
    steps:
      - IM = 2;
