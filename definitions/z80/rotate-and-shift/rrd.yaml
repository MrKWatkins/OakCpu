instructions:
  - group: Rotate and Shift
    mnemonic: RRD
    documentation: "Rotates the low nibble of A and the two nibbles of the byte at (HL) right one nibble as a twelve bit value: the low nibble of (HL) moves to the low nibble of A, the high nibble of (HL) to its low nibble, and the low nibble of A to the high nibble of (HL)."
    opcodes:
      - opcode: 0xED 0x67
    steps:
      - Address = HL; request(action.memory_read);
      - 
      -
      -
      -
      -
      -
      - $lowA = A & 0x0F; A = (A & 0xF0) | (Data & 0x0F); Data = (Data >> 4) | ($lowA << 4); flags(); WZ = HL + 1; Address = HL; request(action.memory_write);
      - 
      - 
      - 
    flags:
      N: 0
      PV: even_parity(A)
      X: copy_from(A)
      H: 0
      Y: copy_from(A)
      Z: is_zero(A)
      S: copy_from(A)
