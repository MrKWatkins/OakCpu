instructions:
  - group: Rotate and Shift
    instruction: RRC R0
    documentation: "Rotates {R0} right one bit; bit 0 is copied to both bit 7 and the carry flag."
    opcodes:
      - opcode: 0xCB 0x08
        R0: B
      - opcode: 0xCB 0x09
        R0: C
      - opcode: 0xCB 0x0A
        R0: D
      - opcode: 0xCB 0x0B
        R0: E
      - opcode: 0xCB 0x0C
        R0: H
      - opcode: 0xCB 0x0D
        R0: L
      - opcode: 0xCB 0x0F
        R0: A
    steps:
      - $temp = R0; R0 = (R0 >> 1) | (R0 << 7); flags();
    flags:
      C: copy_from($temp)
      N: 0
      PV: even_parity(R0)
      X: copy_from(R0)
      H: 0
      Y: copy_from(R0)
      Z: is_zero(R0)
      S: copy_from(R0)

  - group: Rotate and Shift
