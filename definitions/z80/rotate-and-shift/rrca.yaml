instructions:
  - group: Rotate and Shift
    instruction: RRCA
    documentation: "Rotates A right one bit; bit 0 is copied to both bit 7 and the carry flag."
    opcodes:
      - opcode: 0x0F
      - opcode: 0xDD 0x0F
      - opcode: 0xFD 0x0F
    steps:
      - $temp = A; A = (A >> 1) | (A << 7); flags();
    flags:
      C: copy_from($temp)
      N: 0
      X: copy_from(A)
      H: 0
      Y: copy_from(A)
