instructions:
  - group: Exchange, Block Transfer, and Search
    mnemonic: EXX
    documentation: "Exchanges BC, DE and HL with their shadow registers BC', DE' and HL'."
    opcodes:
      - opcode: 0xD9
      - opcode: 0xDD 0xD9
      - opcode: 0xFD 0xD9
    steps:
      - |
        $temp = BC'; BC' = BC; BC = $temp;
        $temp = DE'; DE' = DE; DE = $temp;
        $temp = HL'; HL' = HL; HL = $temp;
