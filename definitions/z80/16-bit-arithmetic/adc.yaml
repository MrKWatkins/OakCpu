instructions:
  - group: 16-Bit Arithmetic
    instruction: ADC HL, RP0
    documentation: "Adds {RP0} and the carry flag to HL."
    opcodes:
      - opcode: 0xED 0x4A
        RP0: BC
      - opcode: 0xED 0x5A
        RP0: DE
      - opcode: 0xED 0x6A
        RP0: HL
      - opcode: 0xED 0x7A
        RP0: SP
    steps:
      - $left = HL; $right = RP0; $result = $left + $right + flag.C; $result16 = $result & 0xFFFF; $high = $result >> 8; HL = $result; WZ = $left + 1; flags();
      -
      -
      -
      -
      -
      -
      - 
    flags:
      C: ($result & 0x10000) == 0x10000
      N: 0
      PV: did_16_bit_addition_overflow($left, $right, $result)
      X: copy_from($high)
      H: did_16_bit_addition_half_carry($left, $right, $result)
      Y: copy_from($high)
      Z: is_zero($result16)
      S: copy_from($high)
