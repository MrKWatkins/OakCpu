# TODO: get_bit function.
cpu:
  name: Z80
  documentation: Provides generated Z80 CPU emulators.
  default_next_opcode: overlapped
  # Every step is a T-state.
  cycles:
    name: T-States
    count: steps
  # The operand bytes named in instructions.
  operands:
    - name: n
      bytes: 1
      documentation: An immediate byte.
    - name: nn
      bytes: 2
      documentation: An immediate word, or a 16-bit address, low byte first.
    - name: d
      bytes: 1
      documentation: A signed displacement byte.
  # How the temporaries the instruction steps use are named in documentation.
  temporaries:
    result: the result
    result16: the 16-bit result
    high: the high byte of the result
    comparison: the tested bit
    sum: the sum
    difference: the difference
  # External documentation for the instructions.
  references:
    - name: Zilog Z80 CPU User Manual
      url: https://www.zilog.com/docs/z80/um0080.pdf
      covers: documented
    - name: Z80 instruction set, MSX Assembly Page
      url: https://map.grauw.nl/resources/z80instr.php
      covers: all
    - name: The Undocumented Z80 Documented
      url: http://www.z80.info/zip/z80-documented.pdf
      covers: undocumented
  # The bus control pins visible to external hardware, sampled at the rising edge of each T-state's clock. Active-low pins are
  # represented as active-high flags.
  pins:
    - name: M1
      documentation: Machine cycle one; the CPU is fetching an opcode, or acknowledging an interrupt when combined with IORQ.

    - name: MREQ
      documentation: Memory request; the address bus holds a valid memory address.

    - name: IORQ
      documentation: Input/output request; the address bus holds a valid I/O port address, or the CPU is acknowledging an interrupt when combined with M1.

    - name: RD
      documentation: Read; the CPU wants to read data from memory or an I/O port.

    - name: WR
      documentation: Write; the data bus holds valid data to write to memory or an I/O port.

    - name: RFSH
      documentation: Refresh; the address bus holds a refresh address for dynamic memory.

    - name: HALT
      documentation: The CPU has executed a HALT instruction and is awaiting an interrupt.

  # Each action's pins list gives the pins asserted during the T-states of its machine cycle, one entry per T-state starting
  # at the step that requests the action.
  actions:
    - name: opcode_read
      documentation: The host must read an opcode byte from memory.
      # T1 asserts M1 with the address; the read happens at T2; T3 and T4 refresh dynamic memory.
      pins: [[M1], [M1, MREQ, RD], [RFSH], [RFSH, MREQ]]

    - name: memory_read
      documentation: The host must read a byte from memory.
      pins: [[], [MREQ, RD], [MREQ, RD]]

    - name: memory_write
      documentation: The host must write a byte to memory.
      pins: [[], [MREQ], [MREQ, WR]]

    - name: io_read
      documentation: The host must read a byte from an I/O port.
      # The request fires at T2 of the four T-state I/O cycle; T1 before it puts the port address on the bus with no control
      # pins asserted, so it needs no entry.
      pins: [[IORQ, RD], [IORQ, RD], [IORQ, RD]]

    - name: io_write
      documentation: The host must write a byte to an I/O port.
      pins: [[IORQ, WR], [IORQ, WR], [IORQ, WR]]

  fields:
    - name: latch
      type: u8

sequences:
  - name: opcode_read
    execute_overlap_on_start: true
    next_opcode: custom
    steps:
      - Address = PC; PC = PC + 1; request(action.opcode_read);
      - 
      - Address = IR; R = (R & 0x80) | ((R + 1) & 0x7F);
      - move_to_opcode();

on_instruction_steps_complete: |
  if instruction_updates_flags();
    Q = F;
  else;
    Q = 0;
  endif;

on_instruction_complete: |
  handle_interrupts();

instructions:    
  - group: Redirects
    instruction: DDCB Redirect
    opcodes:
      - opcode: 0xDD 0xCB
    steps:
      - set_opcode_step_table(opcode_table.DDCB); Address = PC; PC = PC + 1; request(action.memory_read);
      - latch = Data;
      -
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - 
      - move_to_opcode(); set_opcode_step_table();
    next_opcode: custom

  - group: Redirects
    instruction: DDED Redirect
    opcodes:
      - opcode: 0xDD 0xED
    steps:
      - set_opcode_step_table(0xED);

  - group: Redirects
    instruction: DDFD Redirect
    opcodes:
      - opcode: 0xDD 0xFD
    steps:
      - set_opcode_step_table(0xFD);
    
  - group: Redirects
    instruction: FDCB Redirect
    opcodes:
      - opcode: 0xFD 0xCB
    steps:
      - set_opcode_step_table(opcode_table.FDCB); Address = PC; PC = PC + 1; request(action.memory_read);
      - latch = Data;
      -
      - Address = PC; PC = PC + 1; request(action.memory_read);
      - 
      - move_to_opcode(); set_opcode_step_table();
    next_opcode: custom

  - group: Redirects
    instruction: FDED Redirect
    opcodes:
      - opcode: 0xFD 0xED
    steps:
      - set_opcode_step_table(0xED);

  - group: Redirects
    instruction: FDDD Redirect
    opcodes:
      - opcode: 0xFD 0xDD
    steps:
      - set_opcode_step_table(0xDD);
