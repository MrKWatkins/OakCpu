instructions:
  - group: 8-Bit Arithmetic
    mnemonic: CP R0
    documentation: "Compares A with {R0} by subtracting {R0} from A, setting the flags from the result and leaving A unchanged."
    opcodes:
      - opcode: 0xB8
        R0: B
      - opcode: 0xB9
        R0: C
      - opcode: 0xBA
        R0: D
      - opcode: 0xBB
        R0: E
      - opcode: 0xBC
        R0: H
      - opcode: 0xBD
        R0: L
      - opcode: 0xBF
        R0: A
        
      - opcode: 0xDD 0xB8
        R0: B
      - opcode: 0xDD 0xB9
        R0: C
      - opcode: 0xDD 0xBA
        R0: D
      - opcode: 0xDD 0xBB
        R0: E
      - opcode: 0xDD 0xBC
        R0: IXH
      - opcode: 0xDD 0xBD
        R0: IXL
      - opcode: 0xDD 0xBF
        R0: A
        
      - opcode: 0xFD 0xB8
        R0: B
      - opcode: 0xFD 0xB9
        R0: C
      - opcode: 0xFD 0xBA
        R0: D
      - opcode: 0xFD 0xBB
        R0: E
      - opcode: 0xFD 0xBC
        R0: IYH
      - opcode: 0xFD 0xBD
        R0: IYL
      - opcode: 0xFD 0xBF
        R0: A
    steps:
      - $left = A; $right = R0; $result = $left - $right; flags();
    flags:
      C: ($result & 0x100) == 0x100
      N: 1
      PV: did_8_bit_subtraction_overflow($left, $right, $result)
      X: copy_from($right)
      H: did_8_bit_subtraction_half_borrow($left, $right, $result)
      Y: copy_from($right)
      Z: is_zero($result)
      S: copy_from($result)

