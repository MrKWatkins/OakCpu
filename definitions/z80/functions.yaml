functions:
  - name: did_8_bit_addition_overflow
    type: i32_bool
    parameters: [left, right, sum]
    expression: ((sum ^ left) & (sum ^ right) & 0x80) >> 7
    documentation: the addition overflowed
    not_documentation: the addition did not overflow
    value_documentation: the overflow
    
  - name: did_16_bit_addition_overflow
    type: i32_bool
    parameters: [left, right, sum]
    expression: ((sum ^ left) & (sum ^ right) & 0x8000) >> 15
    documentation: the addition overflowed
    not_documentation: the addition did not overflow
    value_documentation: the overflow
    
  - name: did_8_bit_addition_half_carry
    type: i32_bool
    parameters: [left, right, sum]
    expression: ((left ^ right ^ sum) & 0x10) >> 4
    documentation: there was a carry from bit 3 to bit 4
    not_documentation: there was no carry from bit 3 to bit 4
    value_documentation: the half carry

  - name: did_16_bit_addition_half_carry
    type: i32_bool
    parameters: [left, right, sum]
    expression: ((left ^ sum ^ right) & 0x1000) >> 12
    documentation: there was a carry from bit 11 to bit 12
    not_documentation: there was no carry from bit 11 to bit 12
    value_documentation: the half carry
    
  - name: did_8_bit_subtraction_overflow
    type: i32_bool
    parameters: [left, right, difference]
    expression: ((left ^ right) & (difference ^ left) & 0x80) >> 7
    documentation: the subtraction overflowed
    not_documentation: the subtraction did not overflow
    value_documentation: the overflow
    
  - name: did_16_bit_subtraction_overflow
    type: i32_bool
    parameters: [left, right, difference]
    expression: ((left ^ right) & (difference ^ left) & 0x8000) >> 15
    documentation: the subtraction overflowed
    not_documentation: the subtraction did not overflow
    value_documentation: the overflow
    
  - name: did_8_bit_subtraction_half_borrow
    type: i32_bool
    parameters: [left, right, difference]
    expression: ((left ^ right ^ difference) & 0x10) >> 4
    documentation: there was a borrow from bit 4
    not_documentation: there was no borrow from bit 4
    value_documentation: the half borrow
    
  - name: did_16_bit_subtraction_half_borrow
    type: i32_bool
    parameters: [left, right, difference]
    expression: ((left ^ right ^ difference) & 0x1000) >> 12
    documentation: there was a borrow from bit 12
    not_documentation: there was no borrow from bit 12
    value_documentation: the half borrow
    
  - name: even_parity
    type: i32_bool
    parameters: [value]
    expression: ~pop_count(value) & 0x01
    documentation: "{value} has even parity"
    not_documentation: "{value} has odd parity"
    value_documentation: the parity
    
  - name: is_negative
    type: i32_bool
    parameters: [value]
    expression: (value & 0x80) >> 7
    documentation: "bit 7 of {value} is set"
    not_documentation: "bit 7 of {value} is reset"
    value_documentation: "whether {value} is negative"