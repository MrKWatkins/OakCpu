  - instruction: "ARR #n"
    defined_by: 6502
    group: Undocumented
    documentation: Bitwise ANDs A with n, then rotates the result right one bit through the carry flag. The carry and overflow flags are set from bits 6 and 5 of the result as if by an addition, and in decimal mode the result is adjusted as it would be by ADC.
    undocumented: true
    page: undocumented/arr-n.md
    flags:
      N:
        effect: changed
        documentation: Set if bit 7 of A is set, otherwise reset.
      V:
        effect: changed
        documentation: Set if bits 6 and 5 of the result differ, otherwise reset.
      B:
        effect: unaffected
        documentation: Unaffected.
      D:
        effect: unaffected
        documentation: Unaffected.
      I:
        effect: unaffected
        documentation: Unaffected.
      Z:
        effect: changed
        documentation: Set if A is zero, otherwise reset.
      C:
        effect: changed
        documentation: In decimal mode, set if the high nibble of A AND n, plus 0x10 if bit 4 of A AND n is set, is greater than 0x50, otherwise reset. In binary mode, set if bit 6 of the result is set, otherwise reset.
    opcodes:
