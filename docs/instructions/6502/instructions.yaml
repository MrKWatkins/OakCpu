  - instruction: "USBC #n"
    defined_by: 6502
    group: Undocumented
    documentation: "Subtracts n and the borrow, the inverse of the carry flag, from A, exactly as SBC #n does."
    undocumented: true
    page: undocumented/usbc-n.md
    flags:
      N:
        effect: changed
        documentation: In decimal mode, set if bit 7 of the binary result is set, otherwise reset. In binary mode, set if bit 7 of A is set, otherwise reset.
      V:
        effect: changed
        documentation: Set if the subtraction overflowed, otherwise reset.
      B:
        effect: unaffected
        documentation: Unaffected.
      D:
        effect: unaffected
        documentation: Unaffected.
      I:
        effect: unaffected
        documentation: Unaffected.
      Z:
        effect: changed
        documentation: In decimal mode, set if the low byte of the binary result is zero, otherwise reset. In binary mode, set if A is zero, otherwise reset.
      C:
        effect: changed
        documentation: Set if bit 8 of the binary result is reset, otherwise reset.
    opcodes:
      - opcode: EB n
        instruction: "USBC #n"
        cycles: [2]
        undocumented: true
    references:
      - name: "6502 Instruction Set, mass:werk"
        url: "https://www.masswerk.at/6502/6502_instruction_set.html"
      - name: CPU unofficial opcodes, NESdev Wiki
        url: "https://www.nesdev.org/wiki/CPU_unofficial_opcodes"
