cpu: 6502
instructions:
  - instruction: "ADC #n"
    defined_by: 6502
    group: Arithmetic
    documentation: Adds n and the carry flag to A. In decimal mode the addition is binary coded decimal.
    undocumented: false
    page: arithmetic/adc-n.md
    flags:
      N:
        effect: changed
        documentation: In decimal mode, set if bit 7 of the sum of the high nibbles, including any carry from the low nibbles but before the decimal adjustment, is set, otherwise reset. In binary mode, set if bit 7 of A is set, otherwise reset.
      V:
        effect: changed
        documentation: Set if the addition overflowed, otherwise reset.
      B:
        effect: unaffected
        documentation: Unaffected.
      D:
        effect: unaffected
        documentation: Unaffected.
      I:
        effect: unaffected
        documentation: Unaffected.
      Z:
        effect: changed
        documentation: In decimal mode, set if the low byte of the binary result is zero, otherwise reset. In binary mode, set if A is zero, otherwise reset.
      C:
        effect: changed
        documentation: In decimal mode, set if the decimal result is greater than 99, otherwise reset. In binary mode, set if bit 8 of the binary result is set, otherwise reset.
    opcodes:
      - opcode: 69 n
        instruction: "ADC #n"
        cycles: [2]
        undocumented: false
    references:
      - name: MCS6500 Microcomputer Family Programming Manual
        url: "http://archive.6502.org/books/mcs6500_family_programming_manual.pdf"
      - name: "6502 Instruction Set, mass:werk"
        url: "https://www.masswerk.at/6502/6502_instruction_set.html"
