  - instruction: IND
    defined_by: Z80
    group: Input and Output
    documentation: Reads a byte from the port addressed by BC into (HL), then decrements HL and B.
    undocumented: false
    page: input-and-output/ind.md
    flags:
      S:
        effect: changed
        documentation: Set if bit 7 of B is set, otherwise reset.
      Z:
        effect: changed
        documentation: Set if B is zero, otherwise reset.
      Y:
        effect: changed
        documentation: Copied from bit 5 of B.
      H:
        effect: changed
        documentation: "Set if (the value read + ((C - 0x01) & 0xFF)) is greater than 0xFF, otherwise reset."
      X:
        effect: changed
        documentation: Copied from bit 3 of B.
      PV:
        effect: changed
        documentation: "Set if (((the value read + ((C - 0x01) & 0xFF)) & 0x07) ^ B) has even parity, otherwise reset."
      N:
        effect: changed
        documentation: Set if bit 7 of the value read is set, otherwise reset.
      C:
        effect: changed
        documentation: "Set if (the value read + ((C - 0x01) & 0xFF)) is greater than 0xFF, otherwise reset."
