    flags:
      S:
        effect: changed
        documentation: Copied from bit 7 of latch.
      Z:
        effect: changed
        documentation: Set if latch is zero, otherwise reset.
      Y:
        effect: changed
        documentation: When the instruction completes, set if bit 1 of (latch - the half borrow) is set, otherwise reset. When it repeats, set if bit 5 of PCH is set, otherwise reset.
      H:
        effect: changed
        documentation: Set if there was a borrow from bit 4, otherwise reset.
      X:
        effect: changed
        documentation: When the instruction completes, set if bit 3 of (latch - the half borrow) is set, otherwise reset. When it repeats, set if bit 3 of PCH is set, otherwise reset.
      PV:
        effect: changed
        documentation: Set if BC is not zero, otherwise reset.
      N:
        effect: set
        documentation: Set.
      C:
        effect: unaffected
        documentation: Unaffected.
