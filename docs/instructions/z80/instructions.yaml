instructions:
  - instruction: ADC HL, RP0
    defined_by: Z80
    group: 16-Bit Arithmetic
    documentation: "Adds {RP0} and the carry flag to HL."
    undocumented: false
    page: 16-bit-arithmetic/adc-hl-rp0.md
    flags:
      S:
        effect: changed
        documentation: Copied from bit 7 of the high byte of the result.
      Z:
        effect: changed
        documentation: Set if the 16-bit result is zero, otherwise reset.
      Y:
        effect: changed
        documentation: Copied from bit 5 of the high byte of the result.
      H:
        effect: changed
        documentation: Set if there was a carry from bit 11 to bit 12, otherwise reset.
      X:
        effect: changed
        documentation: Copied from bit 3 of the high byte of the result.
      PV:
        effect: changed
        documentation: Set if the addition overflowed, otherwise reset.
      N:
        effect: reset
        documentation: Reset.
      C:
        effect: changed
        documentation: Set if bit 16 of the result is set, otherwise reset.
    opcodes:
      - opcode: ED 4A
