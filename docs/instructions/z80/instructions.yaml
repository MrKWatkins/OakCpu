  - instruction: INDR
    defined_by: Z80
    group: Input and Output
    documentation: Reads a byte from the port addressed by BC into (HL), then decrements HL and B, repeating until B is zero.
    undocumented: false
    page: input-and-output/indr.md
    flags:
      S:
        effect: changed
        documentation: Set if bit 7 of B is set, otherwise reset.
      Z:
        effect: changed
        documentation: Set if B is zero, otherwise reset.
      Y:
        effect: changed
        documentation: When the instruction completes, set if bit 1 of B is set, otherwise reset. When it repeats, set if bit 5 of PCH is set, otherwise reset.
      H:
        effect: changed
        documentation: "When the instruction completes, set if (the value read + ((C - 1) & 0xFF)) is greater than 0xFF, otherwise reset. When it repeats, reset if (the value read + ((C - 1) & 0xFF)) is not greater than 0xFF; otherwise set if the low nibble of B is zero when bit 7 of the value read is set, or 0x0F when it is reset, otherwise reset."
      X:
        effect: changed
        documentation: When the instruction completes, set if bit 3 of B is set, otherwise reset. When it repeats, set if bit 3 of PCH is set, otherwise reset.
      PV:
        effect: changed
        documentation: "When the instruction completes, set if (((the value read + ((C - 1) & 0xFF)) & 7) ^ B) has even parity, otherwise reset. When it repeats, set if (((the value read + ((C - 1) & 0xFF)) & 7) ^ B) and (B & 7) have the same parity, otherwise reset; when (the value read + ((C - 1) & 0xFF)) is greater than 0xFF, ((B - 1) & 7) is used instead of (B & 7) if bit 7 of the value read is set, and ((B + 1) & 7) if it is reset."
      N:
        effect: changed
        documentation: Set if bit 7 of the value read is set, otherwise reset.
      C:
        effect: changed
        documentation: "Set if (the value read + ((C - 0x01) & 0xFF)) is greater than 0xFF, otherwise reset."
    opcodes:
      - opcode: ED BA
        instruction: INDR
        t_states: [16, 21]
        undocumented: false
    references:
      - name: Zilog Z80 CPU User Manual
        url: "https://www.zilog.com/docs/z80/um0080.pdf"
      - name: Z80 instruction set, MSX Assembly Page
        url: "https://map.grauw.nl/resources/z80instr.php"
